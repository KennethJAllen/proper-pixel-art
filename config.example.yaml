# Example pixelate configuration. Every key is optional and shown here at its
# default. See proper_pixel_art/config.py for what each parameter does.
#
#   PixelateConfig.from_yaml("config.yaml")   # from Python
#   ppa input.png --config config.yaml        # from the CLI (flags override)

version: 2               # config schema version (optional; must be 2 when present)

initial_upscale_factor: 2
scale_result: null        # upscale the result by this factor; null = no scaling
transparent_background: false
pixel_width: null         # width of the input's logical pixels; null = auto-detect

mesh:
  crop_border_pixels: 2
  canny_thresholds: [50, 200]
  closure_kernel_size: 8
  cluster_threshold: 4
  angle_threshold_deg: 15
  trim_outlier_fraction: 0.2
  snap_lines: true                 # snap interpolated grid lines to gradient-profile peaks
  snap_search_window_ratio: 0.35   # snap search window as fraction of pixel width
  snap_min_search_window: 2        # minimum snap search window in pixels
  snap_strength_threshold: 0.5     # peak must exceed this x mean profile value to snap
  anchor_snap_window: 2            # snap detected (anchor) lines to peaks within this many pixels
  max_axis_width_ratio: 1.8        # per-axis width estimates further apart than this -> smaller wins
  validate_width: true             # score candidate pixel widths by within-cell variance
  width_keep_tolerance: 1.5   # replace the estimated width only when it scores (1 + this) x the best
  width_replace_tolerance: 0.2 # on correction, accept a replacement scoring within (1 + this) x the best
  profile_width_min_gaps: 5        # fewer Hough gaps than this -> profile width estimate
  split_leftover_fraction: 0.4     # leftover fraction of pixel width that earns an extra grid line (0.5 = plain rounding)
  hough:
    rho: 1.0
    theta_deg: 1.0
    threshold: 100
    min_line_len: 50
    max_line_gap: 10

colors:
  method: dominant                 # dominant (preserve original colors) or palette (quantize)
  alpha_threshold: 128
  transparency_majority_fraction: 0.5
  top_colors_limit: 8
  thumbnail_size: [160, 160]
  background_candidates: null
  palette:                         # used when method is palette
    num_colors: 16                 # palette size (1-256)
    quantize_method: MAXCOVERAGE   # MAXCOVERAGE, FASTOCTREE, MEDIANCUT, LIBIMAGEQUANT
    dither: NONE                   # NONE, ORDERED, RASTERIZE, FLOYDSTEINBERG
    kmeans: 0                      # k-means refinement iterations; 0 disables
  dominant:                        # used when method is dominant
    bin_size: 52                   # RGB bin size for the per-cell dominant color
    merge_distance: 12             # merge output colors closer than this (Euclidean RGB); 0 disables
    merge_linkage: complete        # linkage criterion: complete, average, or single
    max_linkage_colors: 4096       # cap on unique colors fitted by the merge clustering

video:                             # video/GIF inputs only; ignored for still images
  output_format: gif               # gif or mp4; an explicit output path suffix wins
  num_sample_frames: 8             # frames sampled for mesh/palette detection
  min_vote_fraction: 0.25          # keep a grid edge seen in >= this fraction of sampled frames
